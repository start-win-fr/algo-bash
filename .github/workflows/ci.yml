name: Script Bash

on:
    push:
    pull_request:

jobs:
    bash:
        runs-on: ubuntu-26.04
        steps:
            -   name: Récupérer le code
                uses: actions/checkout@v7

            -   name: Vérifier la syntaxe
                run: |
                    for script in */*.sh; do
                        bash -n "$script"
                    done
            
            -   name: Analyser avec shellcheck
                run: shellcheck **/*.sh

            -   name: Résumé
                run: |
                    nb=$(find . -maxdepth 2 -name "*.sh" | wc -l)
                    lignes=$(cat */*.sh | wc -l)
                    {
                        echo "## Statistiques du dépôt"
                        echo ""
                        echo "| Mesure | Valeur |"
                        echo "|---|---|"
                        echo "| Fichiers bash | $nb |"
                        echo "| Lignes de code | $lignes |"
                    } >> "$GITHUB_STEP_SUMMARY"